name: Build datasets

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: Datasets to build, separated by spaces. Leave empty to build all of them.
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Install unrar
        run: sudo apt-get update && sudo apt-get install -y unrar
      - name: Install the project
        run: uv sync --locked
      - name: Build the datasets
        env:
          DATASETS: ${{ inputs.datasets }}
        # Word splitting is intended: each word is a dataset name.
        run: uv run trajectory-datasets build $DATASETS
      - name: Attach the datasets to the latest release
        if: ${{ !cancelled() && hashFiles('builds/*.zip') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$(gh release view --json tagName --jq .tagName)" builds/*.zip --clobber
